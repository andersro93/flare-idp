# Enforces Conventional Commits on every commit in a pull request and on the
# PR title (which becomes the merge commit subject), plus on direct pushes to
# main. The same commitlint configuration runs locally via lefthook.
name: Commit lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint pull request commits
        if: github.event_name == 'pull_request'
        run: bunx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Lint pushed commits
        if: github.event_name == 'push'
        run: |
          if git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            bunx commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose
          else
            bunx commitlint --from HEAD~1 --to HEAD --verbose
          fi

  pr-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: false
