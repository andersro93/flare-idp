name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # All PRs share one preview D1. Refuse migration numbers that already
      # exist on main under another name and require the branch to contain
      # every migration main has.
      - name: Check migration numbering against main
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          mapfile -t main_files < <(git ls-tree --name-only origin/main packages/db/migrations/ | xargs -n1 basename | grep -E '^[0-9]{4}_.*\.sql$' | sort || true)
          mapfile -t branch_files < <(ls packages/db/migrations | grep -E '^[0-9]{4}_.*\.sql$' | sort)
          declare -A main_by_number
          for f in "${main_files[@]}"; do main_by_number["${f:0:4}"]="$f"; done
          status=0
          for f in "${branch_files[@]}"; do
            n="${f:0:4}"
            if [[ -n "${main_by_number[$n]:-}" && "${main_by_number[$n]}" != "$f" ]]; then
              echo "::error::packages/db/migrations/$f reuses number $n which main already has as ${main_by_number[$n]}; renumber it"
              status=1
            fi
          done
          for f in "${main_files[@]}"; do
            if [[ ! -f "packages/db/migrations/$f" ]]; then
              echo "::error::packages/db/migrations/$f exists on main but not on this branch; rebase onto main"
              status=1
            fi
          done
          exit $status

      - name: Lint and format check
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  deploy-production:
    name: Deploy production
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize deploys; never cancel a running one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN secret not set — skipping production deploy."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.creds.outputs.enabled == 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.creds.outputs.enabled == 'true'
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v7
        if: steps.creds.outputs.enabled == 'true'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.creds.outputs.enabled == 'true'
        run: bun install --frozen-lockfile

      # Migrations are append-only once applied here; apply BEFORE deploying
      # so new code never runs against an old schema.
      - name: Apply D1 migrations (production)
        if: steps.creds.outputs.enabled == 'true'
        working-directory: apps/idp
        run: bunx wrangler d1 migrations apply flare-idp --remote --env production

      - name: Build (production)
        if: steps.creds.outputs.enabled == 'true'
        working-directory: apps/idp
        env:
          CLOUDFLARE_ENV: production
        run: bun run build

      - name: Deploy
        if: steps.creds.outputs.enabled == 'true'
        working-directory: apps/idp
        run: bunx wrangler deploy

      - name: Post-deploy smoke
        if: steps.creds.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            ready=$(curl -fsS --max-time 15 https://idp.ros-nett.com/api/health/ready || true)
            if echo "$ready" | grep -q '"ok"'; then break; fi
            if [ "$i" = "5" ]; then echo "::error::/api/health/ready did not become ok: $ready"; exit 1; fi
            sleep 5
          done
          curl -fsS --max-time 15 https://idp.ros-nett.com/.well-known/jwks.json | grep -q '"keys"'
          echo "Smoke passed: health ready + JWKS served."
