# Dependabot keeps GitHub Actions current in small, grouped PRs.
# Commit messages follow Conventional Commits ("ci(deps): …") so
# release-please and the commit lint accept them.
version: 2
updates:
  # NOTE: the "bun" ecosystem is intentionally absent. Dependabot's bun updater
  # only parses bun.lock lockfileVersion <= 1, while bun >= 1.3 writes version 2
  # ("Unsupported bun.lock 'lockfileVersion' 2"). Package dependencies are
  # handled by Renovate instead (see renovate.json — install the Mend Renovate
  # GitHub App on the repository to activate it). Re-add a bun entry here once
  # Dependabot supports lockfile v2.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
